services:
  db:
    image: postgres:18
    container_name: datalaw_db
    environment:
      POSTGRES_USER: datalaw
      POSTGRES_PASSWORD: datalaw
      POSTGRES_DB: datalaw_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalaw -d datalaw_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
