name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 – Testes automatizados (CI)
# Roda em todo push e pull_request. Os jobs de deploy só avançam se este
# job for concluído com sucesso.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Testes Automatizados (CI)
    runs-on: ubuntu-latest

    # Banco de dados PostgreSQL para os testes marcados como `integration`
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: datalaw
          POSTGRES_PASSWORD: datalaw
          POSTGRES_DB: datalaw_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datalaw -d datalaw_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Instalar dependências (incluindo dev)
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Verificar formatação (ruff format)
        run: uv run ruff format --check src tests

      - name: Executar testes unitários
        run: uv run pytest -m "not integration" --tb=short
        env:
          DATABASE_URL: postgresql+psycopg://datalaw:datalaw@localhost:5432/datalaw_db
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}

      - name: Aplicar migrações no banco de testes
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://datalaw:datalaw@localhost:5432/datalaw_db

      - name: Executar testes de integração
        run: uv run pytest -m "integration" --tb=short
        env:
          DATABASE_URL: postgresql+psycopg://datalaw:datalaw@localhost:5432/datalaw_db
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 – Deploy do Frontend (Java/Maven)
# Só executa após o job `test` passar E apenas em push direto para main.
# ─────────────────────────────────────────────────────────────────────────────
  build-and-deploy-frontend:
    name: Build e Deploy Frontend na Nova VM
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar testes do Frontend (Maven)
        run: |
          cd frontend
          chmod +x mvnw
          ./mvnw test

      - name: Build da aplicação Java (Maven)
        run: |
          cd frontend
          # -DskipTests porque os testes já foram executados no step anterior
          ./mvnw package -DskipTests
          # Identifica o jar gerado e renomeia para datalaw.jar na pasta target
          find target/ -maxdepth 1 -name "*.jar" -type f -size +1M -exec cp {} target/datalaw.jar \;

      - name: Preparar ambiente e fazer backup na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_FRONTEND_VM_HOST }}
          username: ${{ secrets.AZURE_FRONTEND_VM_USER }}
          key: ${{ secrets.AZURE_FRONTEND_VM_SSH_KEY }}
          script: |
            mkdir -p /home/azureuser/frontend
            if [ -f /home/azureuser/frontend/datalaw.jar ]; then
              TIMESTAMP=$(date +"%Y%m%d%H%M%S")
              mv /home/azureuser/frontend/datalaw.jar "/home/azureuser/frontend/datalaw_backup_$TIMESTAMP.jar"
              echo "Backup realizado com sucesso: datalaw_backup_$TIMESTAMP.jar"
            fi

      - name: Copiar datalaw.jar para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_FRONTEND_VM_HOST }}
          username: ${{ secrets.AZURE_FRONTEND_VM_USER }}
          key: ${{ secrets.AZURE_FRONTEND_VM_SSH_KEY }}
          source: "frontend/target/datalaw.jar"
          target: "/home/azureuser/frontend/"
          strip_components: 2

      - name: Configurar e reiniciar serviço na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_FRONTEND_VM_HOST }}
          username: ${{ secrets.AZURE_FRONTEND_VM_USER }}
          key: ${{ secrets.AZURE_FRONTEND_VM_SSH_KEY }}
          script: |
            SERVICE_FILE="/etc/systemd/system/datalaw.service"

            # Criação do arquivo de serviço systemd se não existir
            if [ ! -f "$SERVICE_FILE" ]; then
              echo "Criando serviço systemd datalaw.service..."
              sudo bash -c 'cat <<EOF > /etc/systemd/system/datalaw.service
            [Unit]
            Description=DataLaw Java Application
            After=network.target

            [Service]
            User=azureuser
            ExecStart=/usr/bin/java -jar /home/azureuser/frontend/datalaw.jar
            SuccessExitStatus=143
            Restart=on-failure
            Environment="SERVER_PORT=8080"

            [Install]
            WantedBy=multi-user.target
            EOF'
              sudo systemctl daemon-reload
              sudo systemctl enable datalaw.service
            fi

            # Reinicia o serviço
            echo "Reiniciando aplicação datalaw na porta 8080..."
            sudo systemctl restart datalaw.service
            sudo systemctl status datalaw.service --no-pager
            echo "Deploy Frontend concluído com sucesso!"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 – Deploy do Backend (Python/uv)
# Só executa após o job `test` passar E apenas em push direto para main.
# ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend na VM Atual
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar arquivos do backend para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "backend/"
          target: "/home/azureuser/backend/"
          strip_components: 1

      - name: Aplicar migrações e reiniciar serviço do backend na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd /home/azureuser/backend
            chmod +x start.sh

            echo "Sincronizando dependências..."
            uv sync || echo "Aviso: falha no uv sync. Verifique a instalação do uv."

            echo "Aplicando migrações do banco de dados..."
            uv run alembic upgrade head

            SERVICE_FILE="/etc/systemd/system/datalaw-backend.service"

            if [ ! -f "$SERVICE_FILE" ]; then
              echo "Criando serviço systemd datalaw-backend.service..."
              sudo bash -c 'cat <<EOF > /etc/systemd/system/datalaw-backend.service
            [Unit]
            Description=DataLaw Python Backend
            After=network.target

            [Service]
            User=azureuser
            WorkingDirectory=/home/azureuser/backend
            ExecStart=/home/azureuser/backend/start.sh
            Restart=on-failure
            Environment="LOG_LEVEL=INFO"

            [Install]
            WantedBy=multi-user.target
            EOF'
              sudo systemctl daemon-reload
              sudo systemctl enable datalaw-backend.service
            fi

            echo "Reiniciando aplicação backend..."
            sudo systemctl restart datalaw-backend.service
            sudo systemctl status datalaw-backend.service --no-pager
            echo "Deploy Backend concluído com sucesso!"
